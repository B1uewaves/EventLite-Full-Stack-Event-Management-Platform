<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      layout:decorate="~{layouts/default}">
<head>
    <title>All events</title>
</head>
<body>

    <div layout:fragment="content">
        <h1>Homepage</h1>

        <h2>Upcoming Events</h2>

        <div th:if="${#lists.isEmpty(upcomingThree)}" class="alert alert-info">
            <p class="mb-0">There are currently no upcoming events.</p>
        </div>

        <table th:if="${not #lists.isEmpty(upcomingThree)}" class="table table-striped table-hover events-table">
            <colgroup>
                <col style="width: 26%">
                <col style="width: 20%">
                <col style="width: 14%">
                <col style="width: 12%">
            </colgroup>
            <thead>
              <tr>
                <th><i class="fa-solid fa-bolt"></i> Event</th>
                <th><i class="fa-solid fa-map-marker-alt"></i> Venue</th>
                <th><i class="fa-solid fa-calendar"></i> Date</th>
                <th><i class="fa-solid fa-clock"></i> Time</th>
              </tr>
            </thead>
          <tbody>
            <tr th:each="e : ${upcomingThree}" class="position-relative">
              <td th:text="${e.name}">My Event</td>
              <td th:text="${e.venue != null ? e.venue.name : 'Venue TBC'}">Venue TBC</td>
              <td th:text="${{e.date}}">Event date</td>
              <td th:text="${{e.time}}">Event time</td>
              </tr>
          </tbody>
      </table>

    </div>
</body>
</html>
