<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      layout:decorate="~{layouts/default}">
<head>
    <title>All events</title>
    <style>
      .home-title{
        margin-bottom: 0.75rem;
      }
    </style>
</head>
<body>

    <div layout:fragment="content">
        <h1 class="home-title">Homepage</h1>

        <h2>Upcoming Events</h2>

        <table class="table table-striped table-hover events-table">
            <colgroup>
                <col style="width: 26%">
                <col style="width: 20%">
                <col style="width: 14%">
                <col style="width: 12%">
            </colgroup>
            <thead>
              <tr>
                <th><i class="fa-solid fa-bolt"></i> Event</th>
                <th><i class="fa-solid fa-map-marker-alt"></i> Venue</th>
                <th><i class="fa-solid fa-calendar"></i> Date</th>
                <th><i class="fa-solid fa-clock"></i> Time</th>
              </tr>
            </thead>
            
          <tbody>
            <tr th:each="e : ${upcomingThree}" class="position-relative">
              <td>
                <a class="stretched-link text-decoration-none"
                  th:href="@{/events/{id}(id=${e.id}, returnTo='/')}"
                  th:text="${e.name}">My Event </a> 
                  <!--  detailed page (do we need one for venue?) -->
              </td>
              <td th:text="${e.venue != null ? e.venue.name : 'Venue TBC'}">Venue TBC</td>
              <td th:text="${{e.date}}">Event date</td>
              <td th:text="${{e.time}}">Event time</td>
            </tr>

            
            <tr th:if="${#lists.isEmpty(upcomingThree)}">
                <td colspan="4" class="text-center text-muted py-3">
                    There are currently no upcoming events.
                </td>
            </tr>
          </tbody>
      </table>


      <h2>Popular Venues</h2> <table class="table table-striped table-hover venues-table">
        <thead>
          <tr>
            <th><i class="fa-solid fa-map-marker-alt"></i> Venue Name</th>
            <th><i class="fa-solid fa-location-dot"></i> Capacity</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="v : ${popularThree}">
            <td th:text="${v.name}">Venue Name</td>
            <td th:text="${v.capacity}">Capacity</td>
          </tr>

          <tr th:if="${#lists.isEmpty(popularThree)}">
              <td colspan="2" class="text-center text-muted py-3">
                  No venues were found.
              </td>
          </tr>
        </tbody>
      </table>
	  
	  <h2>Social feed</h2>
	  
	  <table class="table table-striped table-hover">

	    <thead>
	      <tr>
	        <th><i class="fa-solid fa-clock"></i> Time</th>
	        <th><i class="fa-solid fa-calendar"></i> Date</th>
	        <th><i class="fa-solid fa-comment"></i> Comment</th>
	      </tr>
	    </thead>

		<tbody>
		  <tr th:each="post : ${posts}">

		    <!-- time -->
		    <td th:text="${post.time}">12:00</td>

		    <!-- date -->
		    <td th:text="${post.date}">2025-03-20</td>

		    <!-- comment -->
		    <td>
		      <a class="text-decoration-none"
		         th:href="${post.url}"
		         target="_blank"
		         th:utext="${post.content}">
		      </a>
		    </td>

		  </tr>

		  <tr th:if="${posts == null or posts.isEmpty()}">
		    <td colspan="3" class="text-center text-muted py-2">
		      No posts available
		    </td>
		  </tr>
		</tbody>
		</table>

		</div>
</body>
</html>
