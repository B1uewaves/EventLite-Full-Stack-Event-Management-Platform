<!-- Shared template, all pages extend it -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <title layout:title-pattern="$LAYOUT_TITLE: $CONTENT_TITLE">EventLite</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/webjars/font-awesome/css/all.min.css" />

  <style>

  .app-navbar{
    padding: 14px 0;
    background: #ffffff;
    border-bottom: 1px solid #e5e5e5;
  }

  .app-navbar .navbar-brand{
    font-size: 22px;
    font-weight: 600;
    color:#1d1d1f;
    margin-right:32px;
  }

  .app-navbar .nav-link{
    font-size:16px;
    font-weight:500;
    color:#4b4b4b;
    margin-right:14px;
  }

  .app-navbar .nav-link:hover{
    color:#000;
  }

  .app-navbar-actions {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  
  .app-auth-group {
    display: flex;
    align-items: center;
    gap: 0.9rem;
  }

  .app-navbar .btn {
    border-radius: 14px;
    padding: 0.6rem 1.1rem;
  }

  .btn-primary{
    background:#0071e3;
    border:none;
  }

  .btn-primary:hover{
    background:#0066cc;
  }

  .btn-warning{
    border-radius:10px;
  }

  .app-user-info {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    margin-bottom: 0;
    white-space: nowrap;
  }

  .app-user-info strong{
    color:#1d1d1f;
    font-weight:600;
  }

  .app-role{
    font-size:13px;
    padding:4px 8px;
    border-radius:8px;
    background:#f2f2f2;
    color:#444;
  }
  
  .events-table > thead {
		border-top: 0 !important;
	}

  </style>
   <!--events-table style added to fix the extra line above table headers (bootstraps css adds an extra line above) -->

</head>

<body>
	<nav class="navbar navbar-expand-lg navbar-light app-navbar">
    <div class="container-fluid px-4">
      <a class="navbar-brand font-weight-bold" th:href="@{/}">EventLite</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-between w-100" id="mainNav">

        <!-- LEFT SIDE -->
        <div class="d-flex align-items-center">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/events}">
                <i class="fa-solid fa-calendar-days" aria-hidden="true"></i>
                <span>All Events</span>
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" th:href="@{/venues}">
                <i class="fa-solid fa-map-marker-alt" aria-hidden="true"></i>
                <span>All Venues</span>
              </a>
            </li>

            <li class="nav-item" sec:authorize="isAuthenticated()">
              <a class="nav-link" th:href="@{/my/events}">
                <i class="fa-solid fa-user-check" aria-hidden="true"></i>
                <span>My Events</span>
              </a>
            </li>

			<div class="app-left-actions">
			  <a class="btn btn-primary" th:href="@{/my/events/new}">
			    <i class="fa-solid fa-plus" aria-hidden="true"></i>
			    <span>Create Event</span>
			  </a>

			  <a sec:authorize="hasRole('ADMINISTRATOR')"
			     class="btn btn-primary"
			     th:href="@{/venues/add}">
			    <i class="fa-solid fa-plus" aria-hidden="true"></i>
			    <span>Create Venue</span>
			  </a>
			</div>
          </ul>
        </div>


		<!-- RIGHT SIDE -->
		<div class="app-navbar-actions">

		  <a sec:authorize="!isAuthenticated()"
		     class="btn btn-outline-secondary"
		     th:href="@{/sign-in}">
		    <i class="fa-solid fa-sign-in-alt" aria-hidden="true"></i>
		    <span>Sign in</span>
		  </a>

		  <div sec:authorize="isAuthenticated()" class="app-auth-group">
		    <span class="app-user-info">
		      <i class="fa-solid fa-user" aria-hidden="true"></i>
		      <span>Logged in as <strong sec:authentication="name"></strong></span>

		      <span sec:authorize="hasRole('ADMINISTRATOR')" class="app-role">
		        Admin
		      </span>

		      <span sec:authorize="hasRole('USER')" class="app-role">
		        User
		      </span>
		    </span>

		    <form th:action="@{/sign-out}" method="post" class="m-0">
		      <button type="submit" class="btn btn-outline-secondary">
		        <i class="fa-solid fa-sign-out-alt" aria-hidden="true"></i>
		        <span>Logout</span>
		      </button>
		    </form>
		  </div>
		</div>

      </div>
    </div>
  </nav>

  <main class="container mt-3">
    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <div layout:fragment="content">
      Main page body goes here...
    </div>
  </main>

  <script type="text/javascript" src="/webjars/popper.js/umd/popper.min.js"></script>
  <script type="text/javascript" src="/webjars/bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
