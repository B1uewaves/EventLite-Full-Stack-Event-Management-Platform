<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/default}">
<head>
  <title>Event Details</title>
</head>
<body>
<div layout:fragment="content">
  <div class="card mt-4">
    <div class="card-header">
      <h2 th:text="${event.name}">Event Name</h2>
    </div>
    <div class="card-body">
      <p>
        <strong>Date:</strong>
        <span th:text="${event.date}">Event Date</span>
      </p>
      <p>
        <strong>Time:</strong>
        <span th:text="${event.time}">Event Time</span>
      </p>
      <p>
        <strong>Venue:</strong>
		<span th:if="${event.venue == null}">Venue TBC</span>
		<a th:if="${event.venue != null}"
		   th:href="@{/venues/{id}(id=${event.venue.id})}"
		   th:text="${event.venue.name}">
		   Venue Name
		</a>
      </p>
      <p>
        <strong>Description:</strong>
        <span th:text="${event.description}">Event Description</span>
      </p>

      <form th:action="@{/events/{id}/share(id=${event.id})}" method="post" class="mt-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="returnTo" th:value="${returnTo}" />

        <div class="mb-3">
          <label for="postContent" class="form-label">Share on Mastodon</label>
          <input id="postContent"
                 type="text"
                 name="postContent"
                 class="form-control"
                 maxlength="500"
                 required
                 th:placeholder="${event.name}" />
        </div>

        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-share-nodes" aria-hidden="true"></i> Share
        </button>
      </form>
    </div>
	<div class="card-footer">

	  <a th:href="${returnTo}" class="btn btn-secondary">
      <!-- if the reurnTo is specified then it goes to the URL if not it goes to /events - JJ -->
	    Back
	  </a>

	  <a sec:authorize="isAuthenticated()"
	     th:if="${#authentication.name == event.ownerUsername}"
	     th:href="@{/events/edit/{id}(id=${event.id}, redirect='/events/' + ${event.id})}"
	     class="btn btn-outline-primary">
	     <i class="fa-solid fa-pen-to-square"></i> Edit
	  </a>
	  
	  <form sec:authorize="isAuthenticated()"
	        th:action="@{/my/events/{id}(id=${event.id})}"
	        th:method="delete"
	        style="display:inline">
	    <button type="submit" class="btn btn-danger">
	      Delete
	    </button>
	  </form>

 <!-- map with check for a single event - JJ -->
  <div id="map" style="height: 400px; width: 100%;"></div>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js"></script>
  <script th:inline="javascript">
  const mapboxAccessToken = /*[[${@environment.getProperty('mapbox.access-token')}]]*/ "";
  

  // the {} at the end makes the code valid and not just a comment 
  // {} just means and empty object
  // it gets populated with real server data at runtime
  var current_event = /*[[${event}]]*/ {}

  if (!mapboxAccessToken) {
    document.getElementById('map').innerHTML = '<div class="text-muted p-3">Map unavailable (Mapbox token not configured).</div>';
  } else if (!current_event.venue || current_event.venue.longitude == null || current_event.venue.latitude == null) {
    document.getElementById('map').innerHTML = '<div class="text-muted p-3">Map unavailable (no location data for this event).</div>';
  } else {
    mapboxgl.accessToken = mapboxAccessToken;

    var long = current_event.venue.longitude;
    var lat = current_event.venue.latitude;

    var popupContent = '<strong>' + current_event.name + '</strong><br>Starts at ' + current_event.time;

    var popup = new mapboxgl.Popup({ offset: 25 }) 
      .setHTML(popupContent);

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/streets-v12',
        center: [long, lat], 
        zoom: 16
      });

    // Create marker and attach the popup
      new mapboxgl.Marker()
        .setLngLat([long, lat])
        .setPopup(popup) 
        .addTo(map);
  }
	</script>

</div>


	</div>
  </div>
</div>
</body>
</html>
