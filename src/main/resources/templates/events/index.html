<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
  <title>All events</title>
</head>
<body>
  <div layout:fragment="content">
    <h1>All events</h1>

    <form method="get" action="/events" class="mb-3">
      <div class="input-group">
        <input type="text" name="search" class="form-control" 
               placeholder="Search events..." th:value="${searchTerm}">
        <button type="submit" class="btn btn-primary">Search</button>
      </div>
    </form>

    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th><i class="fa-solid fa-bolt"></i> Event</th>
          <th><i class="fa-solid fa-map-marker-alt"></i> Venue</th>
          <th><i class="fa-solid fa-calendar"></i> Date</th>
          <th><i class="fa-solid fa-clock"></i> Time</th>
          <th><i class="fa-solid fa-gear"></i> Actions</th> </tr>
        </tr>
      </thead>
	  <tbody>
		<tr th:each="e : ${events}" class="position-relative">
		  <td>
		    <a class="stretched-link text-decoration-none"
		       th:href="@{/events/{id}(id=${e.id})}"
		       th:text="${e.name}">My Event</a>
		  </td>
	      <td th:text="${e.venue != null ? e.venue.name : 'Venue TBC'}">Venue TBC</td>
	      <td th:text="${{e.date}}">Event date</td>
	      <td th:text="${{e.time}}">Event time</td>

        <td style="position: relative; z-index: 10;"> 
          <div class="btn-group" role="group">
            <a th:href="@{/events/edit/{id}(id=${e.id})}" class="btn btn-sm btn-warning">
              <i class="fa-solid fa-pen-to-square"></i> edit
            </a>
          </div>
        </td>
	    </tr>
	  </tbody>
  </table>

  <div class="mt-3">
    <a th:href="@{/events/new}" class="btn btn-primary">
      <i class="fa-solid fa-plus"></i> Add New Event
    </a>
  </div>

  </div>

</body>
</html>
