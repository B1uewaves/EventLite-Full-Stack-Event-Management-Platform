<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
  <title>Create event</title>
</head>
<body>
<div layout:fragment="content">
  <h1>Create event</h1>

  <form th:action="@{/my/events}" method="post" th:object="${event}">
	<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <div class="form-group">
      <label for="name">Name</label>
      <input class="form-control" id="name" type="text" th:field="*{name}" required />
    </div>

    <div class="form-group">
      <label for="date">Date</label>
      <input class="form-control" id="date" type="date" th:field="*{date}" required />
    </div>

    <div class="form-group">
      <label for="time">Time</label>
      <input class="form-control" id="time" type="time" th:field="*{time}" required />
    </div>

    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-warning" href="/my/events">Cancel</a>
  </form>
</div>
</body>
</html>
