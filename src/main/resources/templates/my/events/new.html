<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
  <title>Create event</title>
</head>
<body>
<div layout:fragment="content">
  <h1>Create event</h1>

  <form th:action="@{/my/events}" method="post" th:object="${event}">
	<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <div class="form-group">
      <label for="name">Event Name</label>
      <input class="form-control" id="name" type="text" th:field="*{name}" required />
    </div>

    <div class="form-group">
      <label for="date">Date</label>
      <input class="form-control" id="date" type="date" th:field="*{date}" required />
    </div>

    <div class="form-group">
      <label for="time">Time</label>
      <input class="form-control" id="time" type="time" th:field="*{time}" required />
    </div>

	
	<div class="form-group">
	  <label for="venue">Venue</label>
	  <select class="form-control" id="venue" th:field="*{venue}">
	    <option value="" disabled selected>Select a venue</option>
	    <option th:each="v : ${venues}" th:value="${v.id}" th:text="${v.name}"> </option> </select>
	</div>

	<div class="form-group">
	  <label for="description">Description</label>
	  <textarea class="form-control" id="description" th:field="*{description}" rows="4" required>
	  </textarea>
	</div>
		
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-warning" href="/my/events">Cancel</a>
  </form>
</div>
</body>
</html>
