<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layouts/default}">
  <head>
    <title>Add Venue</title>
  </head>

  <body>
    <div layout:fragment="content">
      <h1>Add Venue</h1>

      <form th:action="@{/venues/add}" th:object="${venue}" method="post">
        <div class="mb-3">
          <label class="form-label">Venue Name</label>
          <input type="text" th:field="*{name}" class="form-control" required />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('name')}"
            th:errors="*{name}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Capacity</label>
          <input
            type="number"
            th:field="*{capacity}"
            class="form-control"
            required
          />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('capacity')}"
            th:errors="*{capacity}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Address</label>
          <input
            type="text"
            th:field="*{address}"
            class="form-control"
            required
          />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('address')}"
            th:errors="*{address}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Postcode</label>
          <input
            type="text"
            th:field="*{postcode}"
            class="form-control"
            required
          />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('postcode')}"
            th:errors="*{postcode}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Latitude</label>
          <input
            type="number"
            step="any"
            th:field="*{latitude}"
            class="form-control"
            placeholder="e.g. 53.4668"
          />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('latitude')}"
            th:errors="*{latitude}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Longitude</label>
          <input
            type="number"
            step="any"
            th:field="*{longitude}"
            class="form-control"
            placeholder="e.g. -2.2339"
          />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('longitude')}"
            th:errors="*{longitude}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea
            th:field="*{description}"
            class="form-control"
            rows="3"
          ></textarea>
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('description')}"
            th:errors="*{description}"
          ></div>
        </div>

        <button type="submit" class="btn btn-primary">Add Venue</button>
        <a th:href="@{/venues}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </body>
</html>
