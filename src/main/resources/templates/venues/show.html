<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
  <title>Venue Details</title>
</head>
<body>
  <div layout:fragment="content">
    <h1 th:text="${venue.name}">Venue Name</h1>

    <table class="table table-striped table-hover">
      <tbody>
        <tr>
          <th>Address</th>
          <td th:text="${venue.address}">Address</td>
        </tr>
        <tr>
          <th>Postcode</th>
          <td th:text="${venue.postcode}">Postcode</td>
        </tr>
        <tr>
          <th>Capacity</th>
          <td th:text="${venue.capacity}">0</td>
        </tr>
      </tbody>
    </table>

    <h2>Upcoming Events</h2>

    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th><i class="fa-solid fa-bolt"></i> Event</th>
          <th><i class="fa-solid fa-calendar"></i> Date</th>
          <th><i class="fa-solid fa-clock"></i> Time</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="event : ${venue.events}"
            th:if="${event.date != null and !event.date.isBefore(T(java.time.LocalDate).now())}">
          <td>
            <a th:href="@{/events/{id}(id=${event.id})}"
               th:text="${event.name}">Event name</a>
          </td>
          <td th:text="${{event.date}}">Event date</td>
          <td th:text="${{event.time}}">Event time</td>
        </tr>

        <tr th:if="${venue.events == null or #sets.isEmpty(venue.events)}">
          <td colspan="3" class="text-center text-muted py-3">
            No upcoming events.
          </td>
        </tr>
      </tbody>
    </table>

    <a class="btn btn-primary" th:href="@{/venues}">Back to venues</a>
  </div>
</body>
</html>
