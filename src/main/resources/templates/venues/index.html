<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/default}"
>
  <head>
    <title>All venues</title>
    <style>
      .venues-table > thead {
        border-top: 0 !important;
      }
    </style>
  </head>
  <body>
    <div layout:fragment="content">
      <h1>All Venues</h1>

      <form method="get" action="/venues" class="mb-3">
        <div class="input-group">
          <input
            type="text"
            name="search"
            class="form-control"
            placeholder="Search venues..."
            th:value="${searchTerm}"
          />
          <button type="submit" class="btn btn-primary">Search</button>
        </div>
      </form>

      <table class="table table-striped table-hover venues-table">
        <thead>
          <tr>
            <th><i class="fa-solid fa-map-marker-alt"></i> Venue Name</th>
            <th><i class="fa-solid fa-location-dot"></i> Capacity</th>
			<th><i class="fa-solid fa-location-dot"></i> ID</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="v : ${venues}">
			<td>
			  <a th:href="@{'/venues/' + ${v.id}}" th:text="${v.name}">Venue Name</a>
			</td>
            <td th:text="${v.capacity}">Capacity</td>
			<td th:text="${v.id}">ID</td>
          </tr>
          
          <tr th:if="${venues == null or #lists.isEmpty(venues)}">
            <td colspan="2" class="text-center text-muted">
              <span th:if="${searchTerm != null}"
                >No venues found matching "<span th:text="${searchTerm}"></span
                >"</span
              >
              <span th:if="${searchTerm == null}">No venues available</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
