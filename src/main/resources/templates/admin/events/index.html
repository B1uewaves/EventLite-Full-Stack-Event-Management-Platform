<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <title>All events</title>
</head>
<body>
  <div layout:fragment="content">
    <h1>All events</h1>

    <form method="get" action="/events" class="mb-3">
      <div class="input-group">
        <input type="text" name="search" class="form-control"
               placeholder="Search events..." th:value="${searchTerm}">
        <button type="submit" class="btn btn-primary">Search</button>
      </div>
    </form>

    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th><i class="fa-solid fa-bolt"></i> Event</th>
          <th><i class="fa-solid fa-map-marker-alt"></i> Venue</th>
          <th><i class="fa-solid fa-calendar"></i> Date</th>
          <th><i class="fa-solid fa-clock"></i> Time</th>
          <th><i class="fa-solid fa-user"></i> Organiser</th>
          <th><i class="fa-solid fa-gear"></i> Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="e : ${events}">
          <td>
            <a class="text-decoration-none"
               th:href="@{/events/{id}(id=${e.id})}"
               th:text="${e.name}">My Event</a>
          </td>
          <td>
            <span th:if="${e.venue == null}">Venue TBC</span>
            <a th:if="${e.venue != null}"
               th:href="@{/venues/{id}(id=${e.venue.id})}"
               th:text="${e.venue.name}">
              Venue Name
            </a>
          </td>
          <td th:text="${{e.date}}">Event date</td>
          <td th:text="${{e.time}}">Event time</td>
          <td>
            <span th:text="${e.ownerUsername}">Owner</span>
            <span th:if="${#authentication.name == e.ownerUsername}"
                  class="text-muted ms-1">(you)</span>
          </td>
          <td>
            <div class="btn-group" role="group">
              <a sec:authorize="isAuthenticated()"
                 th:if="${#authentication.name == e.ownerUsername or #authorization.expression('hasRole(''ADMINISTRATOR'')')}"
                 th:href="@{/admin/events/edit/{id}(id=${e.id}, redirect='/events')}"
                 class="btn btn-sm btn-outline-primary">
                <i class="fa-solid fa-pen-to-square"></i> Edit
              </a>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
