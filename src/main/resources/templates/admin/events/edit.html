<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Update Event</title>
</head>

<body>
  <div layout:fragment="content">
    <div class="container mt-4">
      <h1>Update Event</h1>
      
      <form th:action="@{/events/update/{id}(id=${event.id})}" th:object="${event}" method="post">
        
        <input type="hidden" name="redirect" th:value="${redirect}" />

        <div class="mb-3">
          <label class="form-label">Event Name</label>
          <input type="text" th:field="*{name}" class="form-control" required>
          <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Date</label>
            <input type="date" th:field="*{date}" class="form-control" required>
            <div class="text-danger" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
          </div>
          
          <div class="col-md-6 mb-3">
            <label class="form-label">Time</label>
            <input type="time" th:field="*{time}" class="form-control" required>
            <div class="text-danger" th:if="${#fields.hasErrors('time')}" th:errors="*{time}"></div>
          </div>
        </div>
        
        <div class="mb-3">
          <label for="venue" class="form-label">Venue</label>
          <select class="form-select" id="venue" th:field="*{venue}">
              <option value="" th:text="'Select a venue'"></option>
              <option th:each="v : ${venues}" 
                      th:value="${v.id}" 
                      th:text="${v.name}">
              </option>
          </select>
          <div class="text-danger" th:if="${#fields.hasErrors('venue')}" th:errors="*{venue}"></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
          <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a th:href="@{/events}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</body>
</html>
