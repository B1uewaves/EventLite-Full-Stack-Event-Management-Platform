<!doctype html>
<html>
  <head>
    <title>EventLite Home</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/webjars/font-awesome/css/all.min.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
      <div class="container">
        <a class="navbar-brand" href="/">EventLite</a>

        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="/events">Browse Events</a>
            </li>
          </ul>

          <!-- Create Event Button (Option C route) -->
          <a class="btn btn-primary" href="/admin/events/new">
            <i class="fas fa-plus"></i> Create Event
          </a>
        </div>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container">
      <h1>EventLite</h1>

      <form method="get" action="/events" class="mb-3">
        <div class="input-group">
          <input
            type="text"
            name="search"
            class="form-control"
            placeholder="Search events..."
            th:value="${searchTerm}"
          />
          <button type="submit" class="btn btn-primary">Search</button>
        </div>
      </form>

      <p>
        This is EventLite. See the
        <a href="/events">list of events</a>
        for more information.
      </p>
    </div>

    <script src="/webjars/popper.js/umd/popper.min.js"></script>
    <script src="/webjars/bootstrap/js/bootstrap.min.js"></script>
  </body>
</html>
